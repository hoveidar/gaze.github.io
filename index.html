<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaze Reveal</title>
    <script src="./webgazer.js"></script>
    <script type="module" crossorigin src="/gaze.github.io/assets/index-DYoE0XAt.js"></script>
    <link rel="stylesheet" crossorigin href="/gaze.github.io/assets/index-D8J_FdMK.css">
  </head>
  <body>

    <!-- Text revealed by gaze — populated with a random passage by main.js -->
    <div class="content">
      <p id="passage-body"></p>
      <p id="passage-credit" class="credit"></p>
    </div>

    <!-- Fog overlay canvas -->
    <canvas id="fog-canvas"></canvas>

    <!-- Intro / instruction screen (shown before camera starts) -->
    <div id="intro-screen">
      <div class="intro-card">
        <span class="intro-icon">👁</span>
        <h2>Gaze Reveal</h2>
        <p class="intro-desc">
          Your front camera will track where you look.
          Move your eyes across the screen to paint away the fog
          and uncover the hidden message beneath.
        </p>
        <button id="start-btn">Start Eye Tracker</button>
        <p class="intro-note">Requires camera access · Chrome, Firefox &amp; Safari supported</p>
      </div>
    </div>

    <!-- Calibration overlay (shown after camera starts) -->
    <div id="cal-overlay">
      <p id="cal-label"></p>
      <button id="cal-skip">Skip remaining</button>
      <div id="cal-dot"></div>
    </div>

  </body>
</html>
